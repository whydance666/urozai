<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Урожай-Дорожай — ГИС-платформа управления агробизнесом</title>

  <link rel="icon" type="image/svg+xml" href="../files/znak_guu 1.svg">

  <meta name="description" content="Интеллектуальная система мониторинга полей, управления земельным банком, агрономии и оптимизации цепочек поставок.">

  <meta property="og:title" content="Урожай-Дорожай — Цифровой агроном">
  <meta property="og:description" content="Система автоматизации производственных агротехнологий и логистики.">
  <meta property="og:image" content="../files/og-preview.png">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/map_panel.css">
</head>
<body>

  <div class="app-container">

    <!-- sidebar идёт до header  ~ -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar__header" id="sidebar-toggle">
        <div class="sidebar__logo-wrapper">
          <img src="../files/znak_guu 1.svg" alt="" class="sidebar__logo-icon">
        </div>
        <span class="sidebar__title">Урожай-Дорожай</span>
      </div>

      <nav class="sidebar__nav">

        <!-- агротехнологии -->
        <div class="sidebar__menu-group">
          <button class="sidebar__menu-btn js-submenu-toggle" aria-expanded="false">
            <div class="sidebar__icon-box">
              <img src="../files/Home.svg" alt="" class="sidebar__menu-icon">
            </div>
            <span class="sidebar__btn-text">Производственные агротехнологии</span>
          </button>

          <ul class="sidebar__submenu">
            <li class="sidebar__submenu-item">
              <a href="#" class="sidebar__submenu-link">Модуль управления земельным банком</a>
            </li>
            <li class="sidebar__submenu-item">
              <a href="#" class="sidebar__submenu-link">Модуль агрономии</a>
            </li>
            <li class="sidebar__submenu-item">
              <a href="#" class="sidebar__submenu-link">Модуль Агроэкономики</a>
            </li>
          </ul>
        </div>

        <!-- логистика -->
        <div class="sidebar__menu-group">
          <button class="sidebar__menu-btn js-submenu-toggle" aria-expanded="false">
            <div class="sidebar__icon-box">
              <img src="../files/Truck.svg" alt="" class="sidebar__menu-icon">
            </div>
            <span class="sidebar__btn-text">Логистика и цепочки поставок</span>
          </button>

          <ul class="sidebar__submenu">
            <li class="sidebar__submenu-item">
              <a href="#" class="sidebar__submenu-link">Система управления складом</a>
            </li>
            <li class="sidebar__submenu-item">
              <a href="#" class="sidebar__submenu-link">Поставки и поставщики</a>
            </li>
          </ul>
        </div>

      </nav>
    </aside>

    <header class="main-header">
      <div class="main-header__search-container" id="search-container">
        <button class="main-header__search-btn" id="search-btn" aria-label="Поиск">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <input type="text" class="main-header__search-input" id="search-input" placeholder="Поиск по системе...">
      </div>
    </header>

    <main class="main-content" id="main-content">

      <!--сама карта-->
      <div id="map"></div>

      <!--бургер-->
      <button class="map-burger" id="map-burger" aria-label="Панель управления картой">
        <span></span><span></span><span></span>
      </button>

      <div class="map-panel" id="map-panel">

        <div class="map-panel__tabs">
          <button class="map-panel__tab map-panel__tab--active" data-tab="view">Вид</button>
          <button class="map-panel__tab" data-tab="layers">Слои</button>
          <button class="map-panel__tab" data-tab="sectors">Секторы</button>
        </div>

        <div class="map-panel__body" data-body="view">
          <p class="map-panel__label">Тип карты</p>
          <div class="map-panel__tile-grid">

            <button class="map-tile-btn map-tile-btn--active" data-tile="osm">
              <span class="map-tile-btn__icon">
                <svg viewBox="0 0 24 24">
                  <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"/>
                  <line x1="9" y1="3" x2="9" y2="18"/>
                  <line x1="15" y1="6" x2="15" y2="21"/>
                </svg>
              </span>
              <span>Схема</span>
            </button>

            <!--спутник-->
            <button class="map-tile-btn" data-tile="satellite">
              <span class="map-tile-btn__icon">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M6.3 6.3a8 8 0 0 0 0 11.4"/>
                  <path d="M17.7 6.3a8 8 0 0 1 0 11.4"/>
                  <path d="M3.5 3.5a14 14 0 0 0 0 17"/>
                  <path d="M20.5 3.5a14 14 0 0 1 0 17"/>
                </svg>
              </span>
              <span>Спутник</span>
            </button>

            <!-- рельеф -->
            <button class="map-tile-btn" data-tile="relief">
              <span class="map-tile-btn__icon">
                <svg viewBox="0 0 24 24">
                  <path d="M3 20l4.5-9 4 6 3-4.5 4 7.5H3z"/>
                  <path d="M14 7a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/>
                </svg>
              </span>
              <span>Рельеф</span>
            </button>

          </div>
        </div>

        <div class="map-panel__body map-panel__body--hidden" data-body="layers">
          <p class="map-panel__label">Активные слои</p>
          <label class="map-layer-row">
            <input type="checkbox" data-layer="fields" checked>
            <span class="map-layer-row__dot" style="background:#527034"></span>
            Поля
          </label>
          <label class="map-layer-row">
            <input type="checkbox" data-layer="roads">
            <span class="map-layer-row__dot" style="background:#f5a623"></span>
            Дороги
          </label>
          <label class="map-layer-row">
            <input type="checkbox" data-layer="water">
            <span class="map-layer-row__dot" style="background:#4a90d9"></span>
            Водоёмы
          </label>
          <label class="map-layer-row">
            <input type="checkbox" data-layer="buildings">
            <span class="map-layer-row__dot" style="background:#b0b0b0"></span>
            Постройки
          </label>
        </div>

        <div class="map-panel__body map-panel__body--hidden" data-body="sectors">
          <p class="map-panel__label">Кликни по карте чтобы добавить сектор</p>
          <ul class="map-sector-list" id="sector-list">
            <li class="map-sector-list__empty">Секторы не выбраны</li>
          </ul>
          <button class="map-sector-clear" id="sector-clear">Очистить все</button>
        </div>

      </div>
    </main>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../JS/main.js"></script>
  <script src="../JS/map.js"></script>

</body>
</html>
